configuration:
  haUpdatePeriodInSeconds:
    name: "HA update interval (seconds)"
    description: "How often Home Assistant will be updated with changes from Danfoss Icon master controller (default: 60 seconds)"
  sensorNameFmt:
    name: "Sensor name format"
    description: "Ignored in this fork. Sensors are named sensor.danfoss_<name>_<room>_temperature from the controller's name in the Danfoss app."
  port:
    name: "Port"
    description: "Ignored in this fork. Controller 1A always uses port 9199 and controller 2A uses 9200."
  mqttEnabled:
    name: "MQTT Enabled"
    description: "MQTT auto discovery. Keep disabled with two controllers: MQTT IDs and topics are not split per controller yet."
  mqttHost:
    name: "MQTT Host"
    description: "MQTT Host (default core-mosquitto)"
  mqttPort:
    name: "MQTT Port"
    description: "MQTT Port (default 1883)"
  mqttKeepAlive:
    name: "MQTT Keep Alive"
    description: "MQTT Keep Alive in seconds (default 60)"
  mqttUsername:
    name: "MQTT Username"
    description: "MQTT Username"
  mqttPassword:
    name: "MQTT Password"
    description: "MQTT Password"
  logLevel:
    name: "Logger level"
    description: "Logger level. Possible values are (one of): all,trace,debug,info,warn,error,off"
  m4FixEnabled:
    name: "Mac M4 Fix Enabled"
    description: "If you are running HA on Mac M4 chipset, you might need to enable this option to fix startup issues"
